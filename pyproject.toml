[project]
name = "telegram-workspace-manager"
version = "0.1.0"
description = "A small, skill-oriented Telegram management bot foundation."
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=21,<23"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ai = ["openai>=1,<2"]

[project.scripts]
telegram-workspace-manager = "app.telegram.bot:main"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
